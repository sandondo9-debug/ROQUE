<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ROQUE - Gestión Inteligente</title>
    <style>
        :root {
            --bg-color: #121417;
            --card-bg: #1e2228;
            --accent-green: #2e7d32;
            --accent-green-bright: #4caf50;
            --text-main: #e0e6ed;
            --text-muted: #94a3b8;
            --alert-red: #ef4444;
            --alert-warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #181b20;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .status-light {
            position: absolute;
            top: 12px;
            left: 14px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-green-bright);
            box-shadow: 0 0 6px rgba(76, 175, 80, 0.8);
            z-index: 10;
            animation: parpadeo 2.6s ease-in-out infinite;
        }

        @keyframes parpadeo {
            0%, 100% { opacity: 1; box-shadow: 0 0 6px rgba(76, 175, 80, 0.85); }
            50% { opacity: 0.3; box-shadow: 0 0 2px rgba(76, 175, 80, 0.3); }
        }

        header {
            padding: 16px;
            background-color: var(--card-bg);
            border-bottom: 1px solid #2a2f38;
            text-align: center;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .brand-icon {
            width: 16px;
            height: 16px;
            background-color: var(--accent-green-bright);
            clip-path: polygon(0% 100%, 0% 0%, 25% 0%, 25% 20%, 50% 20%, 50% 0%, 75% 0%, 75% 20%, 100% 20%, 100% 100%);
        }

        .user-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #121417;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
        }

        .user-bar .rol-tag {
            color: var(--accent-green-bright);
            font-weight: 700;
        }

        .user-bar-actions { display: flex; gap: 6px; }

        .reportes-btn {
            background: var(--accent-green-bright);
            color: #0a0d10;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #3a4048;
            color: var(--text-muted);
            font-size: 0.7rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        .content-area {
            flex: 1;
            padding: 16px;
            padding-bottom: 160px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background-color: var(--card-bg);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #2a2f38;
        }

        .card-title {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card textarea {
            width: 100%;
            background: #121417;
            border: 1px solid #2a2f38;
            color: var(--text-main);
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            min-height: 70px;
            resize: vertical;
            margin-top: 8px;
        }

        .card .enviar-texto-btn {
            width: 100%;
            background: var(--accent-green-bright);
            color: #0a0d10;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        .foto-btns {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin-top: 8px;
        }

        .camera-round-btn, .gallery-btn {
            flex: 1;
            background: var(--accent-green-bright);
            color: #0a0d10;
            border: none;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-msg {
            font-size: 0.85rem;
            padding: 10px;
            border-radius: 8px;
            background: #121417;
        }
        .status-ok { color: #4ade80; }
        .status-error { color: #f87171; }
        .status-muted { color: var(--text-muted); }

        .log-item {
            font-size: 0.85rem;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 6px;
            background: #121417;
        }
        .log-user { color: var(--accent-green-bright); font-weight: 600; }
        .log-empty { color: var(--text-muted); font-size: 0.8rem; font-style: italic; }

        /* ---- BOTÓN FLOTANTE (no ocupa todo el ancho, el contenido pasa por detrás) ---- */
        .footer-controls {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            padding: 0 0 calc(14px + env(safe-area-inset-bottom)) 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none; /* deja que el contenido de atrás siga siendo scrolleable */
        }

        .roque-btn-wrapper {
            position: relative;
            pointer-events: auto;
        }

        .roque-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(145deg, #388e3c, #1b5e20);
            border: 4px solid var(--accent-green-bright);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.5);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease;
            outline: none;
            touch-action: none; /* necesario para poder "deslizar" sin que la página scrollee */
        }

        .roque-btn.recording {
            background: linear-gradient(145deg, #b91c1c, #7f1d1d);
            border-color: #ef4444;
            animation: latido 1.1s ease-in-out infinite;
        }

        @keyframes latido {
            0%, 100% { box-shadow: 0 8px 22px rgba(239, 68, 68, 0.55); }
            50% { box-shadow: 0 8px 38px rgba(239, 68, 68, 0.95); }
        }

        .roque-btn-icon { width: 40px; height: 40px; fill: #fff; }

        .lock-indicator {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e2228;
            border: 1px solid #2a2f38;
            border-radius: 16px;
            padding: 6px 12px;
            display: none;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            color: var(--text-muted);
            white-space: nowrap;
        }
        .lock-indicator.visible { display: flex; }
        .lock-indicator.locked { color: var(--accent-green-bright); border-color: var(--accent-green-bright); }

        .btn-hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            font-weight: 600;
            text-align: center;
            pointer-events: none;
        }
        #liveText {
            font-size: 0.72rem;
            color: var(--text-main);
            font-style: italic;
            text-align: center;
            max-width: 220px;
            margin-top: 4px;
            display: none;
            pointer-events: none;
        }

        .badge { display: inline-block; padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: bold; margin-top: 6px; margin-right: 4px; }
        .badge-allowed { background: #1c3d27; color: #4ade80; }
        .badge-area { background: #1c2d3d; color: #60a5fa; }
        .badge-sim { background: #4a3306; color: #fbbf24; }

        .mic-btn {
            background: var(--accent-green-bright);
            border: none;
            color: #0a0d10;
            border-radius: 8px;
            width: 46px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .mic-btn.recording {
            background: #b91c1c;
            animation: latido 1.1s ease-in-out infinite;
        }

        /* ---- SELECTOR REPORTAR / PREGUNTAR (para el botón único de voz) ---- */
        .voz-modo-toggle {
            display: none;
            gap: 4px;
            background: #121417;
            border: 1px solid #2a2f38;
            border-radius: 20px;
            padding: 3px;
            margin-bottom: 10px;
            pointer-events: auto;
        }
        .modo-btn {
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 16px;
            cursor: pointer;
        }
        .modo-btn.active {
            background: var(--accent-green-bright);
            color: #0a0d10;
        }

        /* ---- PANTALLA DE LOGIN ---- */
        #loginScreen {
            width: 100%;
            max-width: 420px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 30px;
            background: #181b20;
            gap: 14px;
        }

        #loginScreen .brand { margin-bottom: 30px; }

        #loginScreen input {
            background: #121417;
            border: 1px solid #2a2f38;
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        #loginScreen button {
            background: var(--accent-green-bright);
            color: #0a0d10;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        #loginError {
            color: var(--alert-red);
            font-size: 0.8rem;
            min-height: 18px;
        }
    </style>
</head>
<body>

<!-- ---- PANTALLA DE LOGIN ---- -->
<div id="loginScreen">
    <div class="brand">
        <div class="brand-icon"></div>
        ROQUE
    </div>
    <input type="email" id="loginEmail" placeholder="Email" autocomplete="username" aria-label="Email">
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña">
    <div id="loginError" role="alert"></div>
    <button onclick="iniciarSesion()">Ingresar</button>
    <button onclick="iniciarConGoogle()" style="background:#fff; color:#1f1f1f; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.3-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4c-7.6 0-14.2 4.3-17.7 10.7z"/>
            <path fill="#4CAF50" d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.3C29.3 35.4 26.8 36 24 36c-5.3 0-9.7-3.1-11.3-7.5l-6.6 5C9.7 39.6 16.3 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.3 5.3C40.9 36.5 44 30.9 44 24c0-1.2-.1-2.3-.4-3.5z"/>
        </svg>
        Ingresar con Google
    </button>
    <button onclick="iniciarConPasskey()" style="background:#2a2f38; color:#fff; display:flex; align-items:center; justify-content:center; gap:8px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
            <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
            <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
            <path d="M2 12a10 10 0 0 1 18-6"/>
            <path d="M2 16h.01"/>
            <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
            <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
            <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
            <path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/>
        </svg>
        Ingresar con Face ID / huella
    </button>
</div>

<!-- ---- APP (se muestra recién después de loguearse) ---- -->
<div class="app-container" id="appContainer" style="display:none;">
    <div class="status-light" title="ROQUE operativo"></div>
    <header>
        <div class="brand">
            <div class="brand-icon"></div>
            ROQUE
        </div>
        <div class="user-bar">
            <span id="userTag">Cargando...</span>
            <div style="display:flex; gap:6px;">
                <button class="logout-btn" onclick="activarPasskey()" aria-label="Activar Face ID o huella" style="display:flex; align-items:center; justify-content:center; padding:6px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/>
                        <path d="M14 13.12c0 2.38 0 6.38-1 8.88"/>
                        <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"/>
                        <path d="M2 12a10 10 0 0 1 18-6"/>
                        <path d="M2 16h.01"/>
                        <path d="M21.8 16c.2-2 .131-5.354 0-6"/>
                        <path d="M5 19.5C5.5 18 6 15 6 12a6 6 0 0 1 .34-2"/>
                        <path d="M8.65 22c.21-.66.45-1.32.57-2"/>
                        <path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/>
                    </svg>
                </button>
                <button class="logout-btn" onclick="cerrarSesion()" aria-label="Cerrar sesión" style="display:flex; align-items:center; justify-content:center; padding:6px;">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <div class="content-area" id="contentArea"></div>

    <div class="footer-controls">
        <div class="voz-modo-toggle" id="vozModoToggle">
            <button type="button" class="modo-btn active" data-modo="reporte" onclick="setModoVoz('reporte')">Reportar</button>
            <button type="button" class="modo-btn" data-modo="pregunta" onclick="setModoVoz('pregunta')">Preguntar</button>
        </div>
        <div class="roque-btn-wrapper">
            <div class="lock-indicator" id="lockIndicator">
                <span class="lock-text">↑ Deslizá para bloquear</span>
            </div>
            <button class="roque-btn" id="roqueBtn" aria-label="Mantené presionado para hablar, deslizá hacia arriba para bloquear la grabación"
                onpointerdown="onPointerDown(event)"
                onpointermove="onPointerMove(event)"
                onpointerup="onPointerUp(event)"
                onpointercancel="onPointerUp(event)">
                <svg class="roque-btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.34 1.34 3 3 3z"/>
                    <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                </svg>
            </button>
        </div>
        <span class="btn-hint" id="btnHint">Mantené presionado para hablar</span>
    </div>
</div>

<!-- Librería de Supabase (para conectar con la base de datos) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
    // ---- CONEXIÓN A SUPABASE ----
    const SUPABASE_URL = 'https://dbcxrcdxymidfvsbzgtp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_60NN3Xnvpcau7vtj7VpP0w_ruH3QMja';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
        auth: { experimental: { passkey: true } }
    });

    // ---- MODO SIMULACIÓN ----
    // En true: "Preguntale a Roque" contesta con datos de ejemplo, sin gastar IA paga.
    // El resto de la app (reportes, fotos, voz) sigue siendo real, porque eso no cuesta IA.
    // Poné esto en false solo cuando quieras probar la IA real (consume créditos).
    const MODO_SIMULACION = true;

    const RESPUESTAS_SIMULADAS = {
        ventas: [
            'Esta noche vendiste un 12% más que el mismo día de la semana pasada. El pico fue entre las 21:30 y las 23:00.',
            'Comparado con la semana pasada, las ventas vienen 8% por debajo. Los tragos son lo que más cayó.'
        ],
        stock: [
            'Según los últimos reportes, se está por terminar el hielo y el limón. Te recomiendo reponer antes del fin de semana.',
            'No hay reportes de faltantes en las últimas 24hs. Stock estable en las áreas que reportaron.'
        ],
        personal: [
            'Los mozos reportaron un total de 14 mensajes esta noche, la mayoría sobre pedidos de mesa. Ningún incidente grave.',
            'Cocina marcó dos demoras por falta de un insumo. Fuera de eso, el turno vino tranquilo.'
        ],
        quejas: [
            'Se registraron 2 quejas de clientes esta semana, ambas por demora en el pedido. Ninguna por calidad de producto.',
            'No hay quejas reportadas en los últimos reportes cargados.'
        ],
        comparar: [
            'Comparando con la semana anterior: +5% en reportes de venta, -10% en incidentes de cocina. Buena tendencia general.',
            'Este mes viene 15% arriba del anterior en actividad reportada, con menos quejas de clientes.'
        ],
        default: [
            'Con los reportes cargados hasta ahora, todo viene dentro de lo normal para un local de este tamaño.',
            'No tengo suficientes reportes todavía para darte un dato preciso sobre eso — a medida que el equipo reporte más, la respuesta va a ser más ajustada.',
            'Buena pregunta. Con la información disponible por ahora, no veo nada fuera de lo común que reportar.'
        ]
    };

    function elegirCategoria(pregunta) {
        const texto = pregunta.toLowerCase();
        if (/venta|factura|caja|ingreso/.test(texto)) return 'ventas';
        if (/stock|falta|insumo|hielo|limón|carne|repone/.test(texto)) return 'stock';
        if (/mozo|cocina|limpieza|personal|equipo|turno/.test(texto)) return 'personal';
        if (/queja|reclamo|cliente/.test(texto)) return 'quejas';
        if (/compar|semana pasada|mes pasado|antes/.test(texto)) return 'comparar';
        return 'default';
    }

    // Simula el tiempo de "pensar" de una IA real, para que la demo se sienta natural.
    function simularRespuestaRoque(pregunta) {
        const opciones = RESPUESTAS_SIMULADAS[elegirCategoria(pregunta)];
        const respuesta = opciones[Math.floor(Math.random() * opciones.length)];
        const demora = 700 + Math.random() * 900;
        return new Promise((resolve) => setTimeout(() => resolve('[Simulado] ' + respuesta), demora));
    }

    let isTalking = false;
    let usuarioActual = null; // { id, nombre, rol, bar_id, area }
    let statusTimeoutId = null;

    const titulosPorRol = {
        operativo:   'Enviar reporte',
        supervision: 'Consola de Control',
        direccion:   'Panel Táctico'
    };
    const subtitulosPorRol = {
        operativo:   'Perfil Operativo',
        supervision: 'Perfil Supervisión',
        direccion:   'Perfil Administración'
    };

    // ---- LOGIN ----
    async function iniciarSesion() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorBox = document.getElementById('loginError');
        errorBox.textContent = '';

        if (!email || !password) {
            errorBox.textContent = 'Completá email y contraseña.';
            return;
        }

        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

        if (error) {
            console.error('Error de login:', error);
            errorBox.textContent = 'Email o contraseña incorrectos.';
            return;
        }

        await cargarPerfilYArrancar(data.user.id);
    }

    async function iniciarConGoogle() {
        const errorBox = document.getElementById('loginError');
        errorBox.textContent = '';
        const { error } = await supabaseClient.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href }
        });
        if (error) {
            console.error('Error iniciando con Google:', error);
            errorBox.textContent = 'No se pudo iniciar con Google: ' + error.message;
        }
        // Si no hubo error, el navegador te lleva a Google y vuelve solo a esta misma página logueado.
    }

    async function iniciarConPasskey() {
        const errorBox = document.getElementById('loginError');
        errorBox.textContent = '';
        try {
            const { data, error } = await supabaseClient.auth.signInWithPasskey();
            if (error) {
                console.error('Error de login con passkey:', error);
                errorBox.textContent = 'No se pudo ingresar con Face ID/huella: ' + error.message;
                return;
            }
            await cargarPerfilYArrancar(data.user.id);
        } catch (e) {
            console.error('Passkey no disponible:', e);
            errorBox.textContent = 'Tu dispositivo no soporta esto, o cancelaste el ingreso.';
        }
    }

    async function activarPasskey() {
        try {
            const { data, error } = await supabaseClient.auth.registerPasskey();
            if (error) {
                console.error('Error activando passkey:', error);
                mostrarEstado('✕ No se pudo activar Face ID/huella: ' + error.message, 'error');
                return;
            }
            mostrarEstado('✓ Face ID / huella activado para este dispositivo', 'ok');
        } catch (e) {
            console.error('Passkey no disponible:', e);
            mostrarEstado('✕ Tu dispositivo no soporta esta función.', 'error');
        }
    }

    async function cerrarSesion() {
        await supabaseClient.auth.signOut();
        usuarioActual = null;
        sessionStorage.removeItem('roque_perfil');
        setModoVoz('reporte');
        document.getElementById('appContainer').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('loginEmail').value = '';
        document.getElementById('loginPassword').value = '';
    }

    function mostrarAppConPerfilCargado() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'flex';

        document.getElementById('userTag').innerHTML = usuarioActual.nombre;

        actualizarSelectorModo();
        renderShell();
    }

    // Busca en la tabla "perfiles" el rol, área y bar del usuario logueado, y arranca la app
    async function cargarPerfilYArrancar(userId) {
        const { data: perfilData, error } = await supabaseClient
            .from('perfiles')
            .select('*')
            .eq('id', userId)
            .single();

        if (error || !perfilData) {
            console.error('Error cargando perfil:', error);
            document.getElementById('loginError').textContent = 'Tu usuario no tiene un perfil asignado. Avisale al administrador.';
            await supabaseClient.auth.signOut();
            return;
        }

        usuarioActual = perfilData;
        sessionStorage.setItem('roque_perfil', JSON.stringify(perfilData));
        mostrarAppConPerfilCargado();
    }

    // Si ya había sesión abierta: usa el perfil guardado en sessionStorage si existe (más rápido),
    // y si no, lo vuelve a pedir a Supabase.
    async function revisarSesionExistente() {
        const { data } = await supabaseClient.auth.getSession();
        if (!data.session) return;

        const cache = sessionStorage.getItem('roque_perfil');
        if (cache) {
            try {
                usuarioActual = JSON.parse(cache);
                mostrarAppConPerfilCargado();
                return;
            } catch (e) {
                console.warn('Caché de perfil corrupto, lo vuelvo a pedir.', e);
            }
        }
        await cargarPerfilYArrancar(data.session.user.id);
    }

    // Dibuja la pantalla: Operativo solo envía. Supervisión/Dirección además pueden preguntarle a Roque.
    function renderShell() {

        const cajaChat = usuarioActual.rol === 'operativo' ? '' : `
            <div class="card">
                <div class="card-title">Preguntale a Roque${MODO_SIMULACION ? ' <span class="badge badge-sim">Simulación</span>' : ''}</div>
                <textarea id="preguntaRoque" placeholder="Ej: ¿cómo viene la noche comparada con la semana pasada?" aria-label="Pregunta para Roque"></textarea>
                <button class="enviar-texto-btn" onclick="preguntarARoque()">Preguntar</button>
                <div id="respuestaRoque" class="status-msg status-muted" style="margin-top:10px; display:none;" role="status"></div>
            </div>
        `;

        document.getElementById('contentArea').innerHTML = `
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:flex-end;">
                    <div>
                        <div class="card-title">${titulosPorRol[usuarioActual.rol]}</div>
                        <div class="card-value">${subtitulosPorRol[usuarioActual.rol]}</div>
                        <span class="badge badge-allowed">${usuarioActual.nombre}</span>
                    </div>
                    <button class="reportes-btn" onclick="mostrarPantallaReportes()" aria-label="Ver reportes">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#0a0d10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="16" y1="13" x2="8" y2="13"/>
                            <line x1="16" y1="17" x2="8" y2="17"/>
                            <line x1="10" y1="9" x2="8" y2="9"/>
                        </svg>
                        Reportes
                    </button>
                </div>
            </div>
            ${cajaChat}
            <div class="card">
                <div class="card-title">Reportar por foto</div>
                <div class="foto-btns">
                    <button class="camera-round-btn" onclick="document.getElementById('inputCamara').click()" aria-label="Sacar foto con la cámara">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#0a0d10" aria-hidden="true">
                            <path d="M9 2 7.17 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3.17L15 2H9zm3 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
                        </svg>
                        Cámara
                    </button>
                    <button class="gallery-btn" onclick="document.getElementById('inputGaleria').click()" aria-label="Elegir foto de la galería">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="#0a0d10" aria-hidden="true">
                            <path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
                        </svg>
                        Galería
                    </button>
                </div>
                <input type="file" id="inputCamara" accept="image/*" capture="environment" style="display:none;" onchange="subirFoto(event)">
                <input type="file" id="inputGaleria" accept="image/*" style="display:none;" onchange="subirFoto(event)">
            </div>
            <div class="card">
                <div class="card-title">Reportar por texto</div>
                <textarea id="textoManual" placeholder="Escribí acá lo que querés reportar..." aria-label="Reporte por texto"></textarea>
                <button class="enviar-texto-btn" onclick="enviarTexto()">Enviar reporte</button>
            </div>
            <div class="card" id="statusCard" style="display:none;">
                <div id="statusMsg" class="status-msg" role="status"></div>
            </div>
        `;
    }

    // Le pregunta a Roque de verdad, usando la función de Supabase que llama a la IA
    async function preguntarARoque() {
        const campo = document.getElementById('preguntaRoque');
        const pregunta = campo.value.trim();
        if (!pregunta) return;

        const cajaRespuesta = document.getElementById('respuestaRoque');
        cajaRespuesta.style.display = 'block';
        cajaRespuesta.className = 'status-msg status-muted';
        cajaRespuesta.textContent = 'Roque está pensando...';

        if (MODO_SIMULACION) {
            const respuesta = await simularRespuestaRoque(pregunta);
            cajaRespuesta.className = 'status-msg status-ok';
            cajaRespuesta.textContent = respuesta;
            return;
        }

        const { data, error } = await supabaseClient.functions.invoke('preguntar-roque', {
            body: {
                pregunta: pregunta,
                bar_id: usuarioActual.bar_id,
                rol: usuarioActual.rol
            }
        });

        if (error) {
            console.error('Error preguntando a Roque:', error);
            cajaRespuesta.className = 'status-msg status-error';
            cajaRespuesta.textContent = '✕ No se pudo consultar a Roque: ' + error.message;
            return;
        }

        cajaRespuesta.className = 'status-msg status-ok';
        cajaRespuesta.textContent = data.respuesta || 'Roque no devolvió respuesta.';
    }

    function mostrarEstado(texto, tipo) {
        const card = document.getElementById('statusCard');
        const msg = document.getElementById('statusMsg');
        if (!card || !msg) return;

        if (statusTimeoutId) {
            clearTimeout(statusTimeoutId);
            statusTimeoutId = null;
        }

        card.style.display = 'block';
        msg.textContent = texto;
        msg.className = 'status-msg status-' + tipo;

        if (tipo === 'ok') {
            msg.style.cursor = 'pointer';
            msg.title = 'Tocá para ver los reportes';
            msg.onclick = mostrarPantallaReportes;
            statusTimeoutId = setTimeout(() => {
                card.style.display = 'none';
            }, 4000);
        } else {
            msg.style.cursor = 'default';
            msg.onclick = null;
        }
    }

    // Según el rol, qué niveles de reportes puede ver
    function rolesPermitidos() {
        if (usuarioActual.rol === 'operativo') return ['operativo'];
        if (usuarioActual.rol === 'supervision') return ['operativo', 'supervision'];
        return ['operativo', 'supervision', 'direccion'];
    }

    // Pantalla con el historial de reportes, filtrado según el rol
    async function mostrarPantallaReportes() {
        document.getElementById('contentArea').innerHTML = `
            <div class="card">
                <button class="enviar-texto-btn" onclick="renderShell()">← Volver</button>
            </div>
            <div class="card">
                <div class="card-title">Reportes</div>
                <div id="listaReportes"><div class="log-empty">Cargando...</div></div>
            </div>
        `;

        const { data, error } = await supabaseClient
            .from('reportes')
            .select('*')
            .eq('bar_id', usuarioActual.bar_id)
            .in('rol', rolesPermitidos())
            .order('creado_en', { ascending: false });

        const lista = document.getElementById('listaReportes');

        if (error) {
            console.error('Error cargando reportes:', error);
            lista.innerHTML = `<div class="log-empty">No se pudo cargar: ${error.message}</div>`;
            return;
        }

        if (!data || data.length === 0) {
            lista.innerHTML = `<div class="log-empty">No hay reportes todavía.</div>`;
            return;
        }

        lista.innerHTML = data.map(r => {
            const fecha = new Date(r.creado_en).toLocaleString('es-AR', {
                day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
            });
            const fotoHtml = r.foto_url ? `<br><a href="${r.foto_url}" target="_blank" style="color:#60a5fa;">Ver foto →</a>` : '';
            return `<div class="log-item">
                <span class="log-user">${r.usuario}</span>
                <span class="status-muted"> · ${r.area || r.rol} · ${fecha}</span><br>
                ${r.mensaje}${fotoHtml}
            </div>`;
        }).join('');
    }

    async function enviarTexto() {
        const campo = document.getElementById('textoManual');
        const texto = campo.value.trim();
        if (!texto) return;
        await guardarMensaje(texto);
        campo.value = '';
    }

    // ---- RECONOCIMIENTO DE VOZ REAL (con texto en vivo mientras escucha) ----
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let vozDisponible = !!SpeechRecognitionAPI;
    let ultimaTranscripcion = '';

    if (vozDisponible) {
        recognition = new SpeechRecognitionAPI();
        recognition.lang = 'es-ES';
        recognition.continuous = true;
        recognition.interimResults = false;

        recognition.onstart = () => {
            document.getElementById('btnHint').innerText = "Escuchando (hablá ahora)...";
        };

        recognition.onresult = (event) => {
            // Reconstruye el texto final completo desde cero en cada resultado,
            // en vez de ir sumando — evita que se repitan palabras.
            let textoFinal = '';
            for (let i = 0; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    textoFinal += event.results[i][0].transcript + ' ';
                }
            }
            ultimaTranscripcion = textoFinal.trim();
        };

        recognition.onerror = (event) => {
            console.error('Error de reconocimiento de voz:', event.error);
            document.getElementById('btnHint').innerText = "No entendí (" + event.error + "), probá de nuevo";
            actualizarColorBoton(false);
            isTalking = false;
            locked = false;
            document.getElementById('lockIndicator').classList.remove('visible', 'locked');
        };

        recognition.onend = async () => {
            const texto = ultimaTranscripcion.trim();
            if (!texto) {
                document.getElementById('btnHint').innerText = "No detecté nada. Mantené presionado y hablá.";
                return;
            }
            if (modoVoz === 'pregunta') {
                if (!document.getElementById('preguntaRoque')) renderShell();
                document.getElementById('preguntaRoque').value = texto;
                await preguntarARoque();
            } else {
                await guardarMensaje(texto);
            }
            ultimaTranscripcion = '';
        };
    }

    // ---- SELECTOR REPORTAR / PREGUNTAR (mismo botón para las dos cosas) ----
    // Operativo no ve el selector: siempre reporta. Supervisión/Dirección eligen
    // el modo antes de hablar, y el botón grande de siempre hace una cosa u otra.
    let modoVoz = 'reporte';

    function setModoVoz(modo) {
        modoVoz = modo;
        document.querySelectorAll('.modo-btn').forEach(b => {
            b.classList.toggle('active', b.dataset.modo === modo);
        });
    }

    function actualizarSelectorModo() {
        const toggle = document.getElementById('vozModoToggle');
        if (!toggle) return;
        if (usuarioActual.rol === 'operativo') {
            toggle.style.display = 'none';
            modoVoz = 'reporte';
        } else {
            toggle.style.display = 'flex';
        }
    }

    // ---- CONTROL DEL BOTÓN: apretar y soltar = mensaje corto. Deslizar hacia arriba = bloquear grabación. ----
    let dragging = false;
    let locked = false;
    let startY = 0;
    const LOCK_THRESHOLD = 70;

    function actualizarColorBoton(grabando) {
        const btn = document.getElementById('roqueBtn');
        if (grabando) btn.classList.add('recording');
        else btn.classList.remove('recording');
    }

    function onPointerDown(e) {
        if (!vozDisponible) {
            alert('Tu navegador no soporta reconocimiento de voz. Probá con Chrome en Android o en computadora.');
            return;
        }

        if (isTalking && locked) {
            pararGrabacion();
            return;
        }
        if (isTalking) return;

        dragging = true;
        locked = false;
        startY = e.clientY;

        const lock = document.getElementById('lockIndicator');
        lock.classList.add('visible');
        lock.classList.remove('locked');
        lock.querySelector('.lock-text').textContent = '↑ Deslizá para bloquear';

        empezarGrabacion();
    }

    function onPointerMove(e) {
        if (!dragging || locked) return;
        const deltaY = startY - e.clientY;
        if (deltaY > LOCK_THRESHOLD) {
            locked = true;
            const lock = document.getElementById('lockIndicator');
            lock.classList.add('locked');
            lock.querySelector('.lock-text').textContent = '🔒 Bloqueado — tocá para detener';
            document.getElementById('btnHint').innerText = 'Grabando bloqueado';
        }
    }

    function onPointerUp(e) {
        if (!dragging) return;
        dragging = false;
        if (locked) return; // sigue grabando aunque sueltes el dedo
        document.getElementById('lockIndicator').classList.remove('visible');
        pararGrabacion();
    }

    function empezarGrabacion() {
        isTalking = true;
        actualizarColorBoton(true);
        document.getElementById('roqueBtn').style.transform = 'scale(0.93)';
        document.getElementById('btnHint').innerText = "Abriendo micrófono...";
        ultimaTranscripcion = '';
        try {
            recognition.start();
        } catch (e) {
            console.warn('recognition.start() ignorado:', e.message);
        }
    }

    function pararGrabacion() {
        if (!isTalking) return;
        isTalking = false;
        locked = false;
        actualizarColorBoton(false);
        document.getElementById('roqueBtn').style.transform = 'scale(1)';
        document.getElementById('btnHint').innerText = "Procesando lo que dijiste...";
        document.getElementById('lockIndicator').classList.remove('visible', 'locked');
        recognition.stop();
    }

    // Guarda el reporte (por voz, texto o foto) y muestra una confirmación clickeable
    async function guardarMensaje(texto, fotoUrl) {
        const fila = {
            bar_id: usuarioActual.bar_id,
            usuario: usuarioActual.nombre,
            rol: usuarioActual.rol,
            area: usuarioActual.area,
            mensaje: texto,
            foto_url: fotoUrl || null
        };

        const { error } = await supabaseClient.from('reportes').insert([fila]);

        if (error) {
            console.error('Error guardando reporte:', error);
            document.getElementById('btnHint').innerText = "Error al guardar";
            mostrarEstado('✕ No se pudo guardar: ' + (error.message || JSON.stringify(error)), 'error');
            return;
        }

        document.getElementById('btnHint').innerText = "Mantené presionado para hablar";
        mostrarEstado('✓ Reporte enviado: "' + texto + '"', 'ok');
    }

    // Comprime la imagen en el navegador antes de subirla (más rápido y liviano)
    function comprimirImagen(archivo, calidad, maxAncho) {
        return new Promise((resolve, reject) => {
            const lector = new FileReader();
            lector.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    let ancho = img.width;
                    let alto = img.height;
                    if (ancho > maxAncho) {
                        alto = Math.round(alto * (maxAncho / ancho));
                        ancho = maxAncho;
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = ancho;
                    canvas.height = alto;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, ancho, alto);
                    canvas.toBlob((blob) => {
                        if (blob) resolve(blob);
                        else reject(new Error('No se pudo comprimir la imagen'));
                    }, 'image/jpeg', calidad);
                };
                img.onerror = () => reject(new Error('No se pudo leer la imagen'));
                img.src = e.target.result;
            };
            lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
            lector.readAsDataURL(archivo);
        });
    }

    // Sube una foto (comprimida) a Supabase Storage y guarda un reporte con el link
    async function subirFoto(event) {
        const archivo = event.target.files[0];
        if (!archivo) return;

        mostrarEstado('Comprimiendo y subiendo foto...', 'muted');

        let blobParaSubir;
        try {
            blobParaSubir = await comprimirImagen(archivo, 0.75, 1600);
        } catch (e) {
            console.warn('No se pudo comprimir, subo el original:', e.message);
            blobParaSubir = archivo;
        }

        const nombreArchivo = `${usuarioActual.bar_id}/${Date.now()}.jpg`;

        const { error: errorSubida } = await supabaseClient
            .storage
            .from('FOTOS')
            .upload(nombreArchivo, blobParaSubir, { contentType: 'image/jpeg' });

        if (errorSubida) {
            console.error('Error subiendo foto:', errorSubida);
            mostrarEstado('✕ No se pudo subir la foto: ' + (errorSubida.message || JSON.stringify(errorSubida)), 'error');
            return;
        }

        const { data: urlPublica } = supabaseClient
            .storage
            .from('FOTOS')
            .getPublicUrl(nombreArchivo);

        await guardarMensaje('(foto adjunta)', urlPublica.publicUrl);
        event.target.value = '';
    }

    // Arranque: si ya había sesión abierta, entra directo (usando caché si existe). Si no, se queda en el login.
    revisarSesionExistente();
</script>
